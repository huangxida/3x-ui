name: Build & Publish 3x-ui Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to build/publish, for example 2026.06.30 or v3.3.0. Leave empty to use the latest release tag."
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"

concurrency:
  group: publish-3x-ui
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/3x-ui

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_version: ${{ steps.version.outputs.image_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          is_release_tag() {
            [[ "$1" == v* || "$1" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]
          }

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if ! is_release_tag "$GITHUB_REF_NAME"; then
              echo "Unsupported release tag '${GITHUB_REF_NAME}'. Expected v* or YYYY.MM.DD." >&2
              exit 1
            fi
            image_version="${GITHUB_REF_NAME}"
            release_tag="${GITHUB_REF_NAME}"
            target_ref="${GITHUB_REF_NAME}"
          else
            requested_tag="${{ inputs.version_tag || '' }}"
            if [[ -n "$requested_tag" ]]; then
              if ! is_release_tag "$requested_tag"; then
                echo "Unsupported release tag '${requested_tag}'. Expected v* or YYYY.MM.DD." >&2
                exit 1
              fi
              if ! git rev-parse --verify --quiet "${requested_tag}^{commit}" >/dev/null; then
                echo "Requested tag '${requested_tag}' does not exist." >&2
                exit 1
              fi
              image_version="$requested_tag"
              release_tag="$requested_tag"
              target_ref="$requested_tag"
            else
              latest_tag="$(git tag --list '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]' --sort=-v:refname | head -n 1)"
              if [[ -z "$latest_tag" ]]; then
                latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
              fi
              if [[ -n "$latest_tag" ]]; then
                image_version="$latest_tag"
                release_tag="$latest_tag"
                target_ref="$latest_tag"
              else
                image_version="$(git rev-parse --short=12 HEAD)"
                release_tag=""
                target_ref="HEAD"
              fi
            fi
          fi

          target_sha="$(git rev-parse "${target_ref}^{commit}")"
          short_sha="$(git rev-parse --short=12 "$target_sha")"

          {
            echo "image_version=${image_version}"
            echo "release_tag=${release_tag}"
            echo "target_sha=${target_sha}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

          echo "Image version: ${image_version}"
          echo "Release tag: ${release_tag:-<none>}"
          echo "Target SHA: ${target_sha}"

  build:
    name: Build, push, and prune image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          submodules: true
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        shell: bash
        run: |
          IMAGE_VERSION="${{ needs.prepare.outputs.image_version }}"

          docker buildx build \
            --platform linux/amd64 \
            --build-arg XUI_ASSET_VERSION="${IMAGE_VERSION}" \
            --build-arg TARGETARCH=amd64 \
            -t "$GHCR_IMAGE:${IMAGE_VERSION}" \
            -t "$GHCR_IMAGE:latest" \
            --push \
            .

      - name: Prune old GHCR image versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: 3x-ui
          KEEP_RELEASES: "5"
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          owner_type="$(gh api -H "Accept: application/vnd.github+json" "/users/${OWNER}" --jq '.type')"
          if [[ "$owner_type" == "Organization" ]]; then
            package_endpoint="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          else
            package_endpoint="/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          fi

          versions_file="$tmpdir/versions.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            --slurp \
            "${package_endpoint}?per_page=100" \
            | jq '[.[][]]' > "$versions_file"

          release_versions_file="$tmpdir/release-versions.json"
          jq '
            def is_release_tag:
              test("^v") or test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$");

            map(. + {
              release_tags: ([.metadata.container.tags[]? | select(is_release_tag)])
            })
            | map(select(.release_tags | length > 0))
            | sort_by(.created_at)
            | reverse
          ' "$versions_file" > "$release_versions_file"

          release_count="$(jq 'length' "$release_versions_file")"
          echo "Found ${release_count} published image versions."

          keep_versions_file="$tmpdir/keep-versions.json"
          jq --argjson keep "$KEEP_RELEASES" '.[0:$keep]' "$release_versions_file" > "$keep_versions_file"

          keep_ids_file="$tmpdir/keep-ids.txt"
          jq -r '.[].id' "$keep_versions_file" | sort -u > "$keep_ids_file"

          keep_digests_file="$tmpdir/keep-digests.txt"
          jq -r '.[].name' "$keep_versions_file" > "$keep_digests_file"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            echo "Collecting retained manifest digests for ${GHCR_IMAGE}:${tag}"
            timeout 60s docker buildx imagetools inspect --raw "${GHCR_IMAGE}:${tag}" \
              | jq -r '
                  .digest? // empty,
                  .manifests[]?.digest? // empty,
                  .config.digest? // empty,
                  .layers[]?.digest? // empty
                ' >> "$keep_digests_file"
          done < <(jq -r '.[].release_tags[0]' "$keep_versions_file")

          sort -u -o "$keep_digests_file" "$keep_digests_file"

          delete_candidates_file="$tmpdir/delete-candidates.json"
          jq \
            --rawfile keep_ids "$keep_ids_file" \
            --rawfile keep_digests "$keep_digests_file" \
            '
              def is_release_tag:
                test("^v") or test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$");
              def tags:
                (.metadata.container.tags // []);
              def release_tags:
                [tags[]? | select(is_release_tag)];
              def only_latest_tag:
                ((tags | length) > 0 and all(tags[]; . == "latest"));

              ($keep_ids | split("\n") | map(select(length > 0) | tonumber)) as $keepIds
              | ($keep_digests | split("\n") | map(select(length > 0))) as $keepDigests
              | map(. + {release_tags: release_tags})
              | map(select(
                  .id as $id
                  | .name as $name
                  | (($keepIds | index($id)) | not)
                  and (($keepDigests | index($name)) | not)
                  and (
                    ((.release_tags | length) > 0)
                    or ((tags | length) == 0)
                    or only_latest_tag
                  )
                ))
              | sort_by(.created_at)
            ' "$versions_file" > "$delete_candidates_file"

          delete_count="$(jq 'length' "$delete_candidates_file")"
          if [[ "$delete_count" -eq 0 ]]; then
            echo "No old GHCR image versions to prune."
            exit 0
          fi

          echo "Deleting ${delete_count} old GHCR image version(s)."
          jq -c '.[]' "$delete_candidates_file" | while IFS= read -r version; do
            id="$(jq -r '.id' <<< "$version")"
            name="$(jq -r '.name' <<< "$version")"
            tags="$(jq -r '(.metadata.container.tags // []) | join(",")' <<< "$version")"
            echo "Deleting package version ${id} (${name}; tags=${tags:-<none>})"
            gh api \
              -H "Accept: application/vnd.github+json" \
              --method DELETE \
              "${package_endpoint}/${id}" \
              --silent
          done
